CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# HID high-resolution scroll: DELIBERATELY OFF on this board.
#
# It cannot work on macOS and it actively breaks scroll acceleration:
#
#  1. macOS ignores the HID Resolution Multiplier entirely. Apple's shipping
#     IOHIDFamily-2238.100.59 contains zero occurrences of
#     "ResolutionMultiplier", and the macOS 27 SDK does not even define a
#     constant for Generic Desktop usage 0x48. So the host never negotiates a
#     multiplier, ZMK keeps its default of 15, and input_listener.c computes
#     div = 16 - 15 = 1 — no scaling ever happens.
#  2. Worse, behavior_input_two_axis.c:86-100 only defines
#     get_acceleration_exponent() when this symbol is set, and it force-returns
#     0 for INPUT_REL_WHEEL whenever the multiplier is > 0 (always, by default).
#     speed() then short-circuits to max_speed, so acceleration-exponent and
#     time-to-max-speed-ms on &msc become DEAD PARAMETERS.
#  3. And apply_resolution_scaling() discards its own result
#     (`evt->value = val;` where `scaled` is computed and dropped) — upstream
#     zmkfirmware/zmk#3383, open and unmerged.
#
# Net effect with it on: no high-resolution scroll AND no acceleration.
# No Keyball community config enables it (tangbonze, gildacosta, stlimtat,
# toeck98 all have zero CONFIG_ZMK_POINTING_* lines).
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING is not set

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_PMW3610=y
CONFIG_PM_DEVICE=y
CONFIG_PMW3610_PM=y
CONFIG_PMW3610_CPI=700
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SNIPE_CPI=400
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=40
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_POLLING_RATE_125_SW=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
