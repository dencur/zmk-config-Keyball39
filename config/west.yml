manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tangbonze
      url-base: https://github.com/tangbonze
    - name: dencur
      url-base: https://github.com/dencur
  projects:
    # Fork of zmkfirmware/zmk at tag v0.3 with ONE commit on top: the scroll
    # wheel's HID descriptor declares a physical range so macOS can compute a
    # real resolution instead of falling back to 9.0 (which makes one wheel
    # unit ~3 lines, i.e. visibly stepped scrolling). See
    # dencur/zmk@v0.3-wheel-resolution. Rebase this branch on the next ZMK
    # release rather than letting it drift.
    - name: zmk
      remote: dencur
      revision: v0.3-wheel-resolution
      import: app/west.yml
    # Fork of tangbonze/zmk-pmw3610-driver with ONE commit: process_scroll_events
    # used to zero the OPPOSITE axis's accumulator when it fired. Vertical is
    # processed first, so any vertical drift discarded the banked horizontal
    # counts and left-right ball scrolling only worked on a perfectly
    # horizontal roll. See dencur/zmk-pmw3610-driver@fix-hscroll-axis-wipe.
    # Rebase on tangbonze/main rather than letting it drift.
    - name: zmk-pmw3610-driver
      remote: dencur
      revision: fix-hscroll-axis-wipe
  self:
    path: config
